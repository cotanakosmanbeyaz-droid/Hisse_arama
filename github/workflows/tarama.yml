name: Hisse Tarama

on:
  schedule:
    - cron: '0 7 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tarama.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
